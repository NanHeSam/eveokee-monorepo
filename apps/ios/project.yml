name: Eveokee
options:
  bundleIdPrefix: com.eveokee
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '27.0'
packages:
  Convex:
    url: https://github.com/get-convex/convex-swift
    exactVersion: 0.8.1
  Clerk:
    url: https://github.com/clerk/clerk-ios
    exactVersion: 1.6.1
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: '-'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '2.0.0'
    DEVELOPMENT_TEAM: 5KQ8K9W7XS
    CURRENT_PROJECT_VERSION: '3'
targets:
  Eveokee:
    type: application
    platform: iOS
    sources: [Eveokee, Resources]
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - package: Convex
        product: ConvexMobile
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eveokee.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/Eveokee.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Eveokee
        INFOPLIST_KEY_CLERK_PUBLISHABLE_KEY: $(CLERK_PUBLISHABLE_KEY)
        INFOPLIST_KEY_CONVEX_URL: $(CONVEX_URL)
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CLERK_PUBLISHABLE_KEY: $(CLERK_PUBLISHABLE_KEY)
        CONVEX_URL: $(CONVEX_URL)
        NSMicrophoneUsageDescription: Record a spoken moment to turn into editable words.
        NSSpeechRecognitionUsageDescription: Transcribe your spoken moments on device so you can review and keep them.
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [eveokee-native, com.eveokee.app]
  EveokeeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [__tests__]
    dependencies:
      - target: Eveokee
  EveokeeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [EveokeeUITests]
    dependencies:
      - target: Eveokee
schemes:
  Eveokee:
    build:
      targets:
        Eveokee: all
    test:
      targets: [EveokeeTests, EveokeeUITests]
